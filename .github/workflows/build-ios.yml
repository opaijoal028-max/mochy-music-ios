name: Build iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build IPA
        working-directory: ios
        run: ./scripts/build-ipa.sh Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mochy-unsigned-ipa
          path: ios/build/Mochy.ipa
          if-no-files-found: error
          retention-days: 14
